<!-- ABOUTME: Contact page for the Troutwater Restoration static site.
     ABOUTME: Placeholder contact method until a real email/phone/form backend is set up. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Troutwater Restoration</title>
  <meta name="description" content="Contact Troutwater Restoration, LLC, based in Bozeman, Montana.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="assets/images/logo.jpg" width="448" height="143" decoding="async" alt="Troutwater Restoration logo">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About TWR</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <div class="container">
        <h1>Contact TWR</h1>
        <p class="address">Bozeman, Montana 59715</p>

        <form class="contact-form" id="contact-form" action="https://formspree.io/f/mqpqalzw" method="POST">
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" maxlength="100">
          </div>

          <div class="form-field">
            <label for="email">Email <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-field">
            <label for="message">Message <span aria-hidden="true">*</span></label>
            <textarea id="message" name="message" rows="6" maxlength="2000" required></textarea>
          </div>

          <input type="hidden" name="_subject" value="New message from troutwaterconsulting.com">

          <button type="submit" class="read-more">Send message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <h2>TWR</h2>
      <p class="tagline">River Restoration Design</p>
      <p class="address">Bozeman, Montana 59715</p>
      <p class="copyright">&copy; <span id="year"></span> Troutwater Restoration, LLC.</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script>
    (function () {
      var form = document.getElementById("contact-form");
      var status = document.getElementById("form-status");
      if (!form || !status) return;

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        status.textContent = "Sending…";
        status.className = "form-status";

        fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        })
          .then(function (response) {
            if (response.ok) {
              form.reset();
              var fields = form.querySelectorAll(".form-field, button");
              fields.forEach(function (el) { el.style.display = "none"; });
              status.textContent = "Thanks for reaching out — we'll get back to you soon.";
              status.className = "form-status form-status-success";
            } else {
              status.textContent = "Something went wrong sending that. Please try again, or email us directly.";
              status.className = "form-status form-status-error";
            }
          })
          .catch(function () {
            status.textContent = "Something went wrong sending that. Please try again, or email us directly.";
            status.className = "form-status form-status-error";
          });
      });
    })();
  </script>
</body>
</html>
